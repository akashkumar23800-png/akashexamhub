[build]
  command = "npm run build"
  publish = "dist"

# Redirects are evaluated in order; keep the catch-all last.

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/login/*"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/auth"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/auth/*"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/signin"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/sign-in"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# SPA fallback so client-side paths never return Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
